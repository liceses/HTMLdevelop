<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <link rel="stylesheet" href="/blog/main.css">
    
    <style>
        .main-content{
            position: relative;
            padding-left: 2cm;
            height: auto;
            z-index: 1;
            background-color: var(--background-white);
        }
        .grid-cont{
            position: relative;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows:400px 200px 200px;
            gap: 20px;
            padding-top: 150px;
        }
        .grid-box{
            
            color: var(--font-green);
            background-color: var(--cardBackground);
            
            border-radius: 5%;
            box-shadow: 0 0 5px var(--card-box-shadow);
            opacity: 1;
        }
        .grid-cont .grid-box:nth-child(1){
            grid-column: 1/-1;
            position: relative;

        }
        .grid-cont .grid-box:nth-child(2){
            grid-column: 1/3;
            position: relative;
            

        }
        .grid-cont .grid-box:nth-child(3){
            grid-column: 3/5;
            position: relative;

        }
        .grid-cont .grid-box:nth-child(4){
            grid-column: 1/3;
            position: relative;

        }
        .grid-cont .grid-box:nth-child(5){
            grid-column: 3/5;
            position: relative;

        }
        .decoration.maomao{
            position: absolute;
            bottom: 0;
            left: -15%;
            background-image: url('../resource/aboutme/maomao.png');
            background-size: auto 150%;
            background-repeat: no-repeat;
            background-position: 0 0;
            height: 150%;
            width: 60%;
            opacity: 0.9;
            z-index: 1;
        }

    </style>
</head>
<body>

        </div>
        <div class="menu-box">
            <a href="/blog/pages/UsefulWebsite.html"><span><h1> <img style="filter:invert(100%) ;" src="/blog/resource/icons/Github-Octicons-Globe-24.svg" alt="Websites"></h1><p id="bardes">Useful Websites</p></span></a>
        </div>
        <div class="menu-box">
            <a href=""><span><h1><img style="filter: invert(1);" src="/blog/resource/icons/Colebemis-Feather-Star.svg" alt="Mylove"></h1><p id="bardes">MyFavorate</p></span></a>
        </div>
        <div class="menu-box">
