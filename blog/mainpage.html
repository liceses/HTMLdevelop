        window.onresize = whenResize;
        whenResize();
        document.getElementById('welcome-pictures').addEventListener('mouseover', function() {
            //鼠标移动到图片上sidebar的width变为2cm，文字透明度变0
            document.getElementById('bar').style.width = '2cm';
            var bardes = document.querySelectorAll('#bar .menu-box span p')
            Array.from(bardes).forEach(function(element){
                element.style.opacity = '0';
            })
        });
        //为sidebar的每个menu-box添加鼠标悬停事件
        const menus = document.getElementById('bar').getElementsByClassName('menu-box');
        Array.from(menus).forEach(element => {
            element.addEventListener('mouseover',toggleSidebar)
        });

        //滚轮事件:内容页面向上滚动显示视觉图，视觉图向下滚动或点击显示内容页面
        document.getElementsByClassName('apage')[0].addEventListener('wheel', function(event) {
            if (event.deltaY < 0) {
                document.getElementsByClassName('pic')[0].style.display = 'block';
                document.getElementById('bar').style.display = 'flux';
                document.getElementsByClassName('pic')[0].scrollIntoView({behavior: "smooth"});
            }
            
        });
        document.getElementsByClassName('pic')[0].addEventListener('click', showMainContent);
        document.getElementsByClassName('pic')[0].addEventListener('wheel', function(event) {
            if (event.deltaY > 0) {
                showMainContent();
            }else{
                document.getElementsByClassName('apage')[0].style.display = 'none';
            }
        });
        //监听页面滚动事件：当页面滚动到顶部时隐藏内容页面
