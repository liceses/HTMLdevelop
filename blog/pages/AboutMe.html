    <style>
        .main-content{
            position: relative;
            padding-left: 2cm;
            height: auto;
            z-index: 1;
            background-color: var(--background-white);
        }
        .grid-cont{
            position: relative;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows:400px 200px 200px;
            gap: 20px;
            padding-top: 25%;
        }
        .grid-box{
            
            color: var(--font-green);
            background-color: var(--cardBackground);
            border-radius: 5%;
            box-shadow: 0 0 5px var(--card-box-shadow);
            opacity: 1;
        }
        .grid-cont .grid-box:nth-child(1){
            grid-column: 1/-1;
            position: relative;

        }
        .grid-cont .grid-box:nth-child(2){
            grid-column: 1/3;
            position: relative;
            

        }
        .grid-cont .grid-box:nth-child(3){
            grid-column: 3/5;
            position: relative;

        }
        .grid-cont .grid-box:nth-child(4){
            grid-column: 1/3;
            position: relative;

        }
        .grid-cont .grid-box:nth-child(5){
            grid-column: 3/5;
            position: relative;

        }
        .decoration.maomao{
            position: absolute;
            bottom: 0;
            left: -15%;
            background-image: url('../resource/aboutme/maomao.png');
            background-size: auto 150%;
            background-repeat: no-repeat;
            background-position: 0 0;
            height: 150%;
            width: 60%;
            opacity: 0.9;
            z-index: 1;
        }
        @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
